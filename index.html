<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="description" content="Tanit School - bibliothèque numérique gratuite pour les élèves de Tunisie" />
  <title>Tanit School</title>
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>
  <nav id="navbar" class="navbar"></nav>

  <main>
    <section class="hero">
      <h1 data-i18n="hero.title"></h1>
      <p data-i18n="hero.subtitle"></p>
      <div class="hero-actions">
        <a href="browse.html" class="btn btn-lg" data-i18n="hero.browse"></a>
        <a href="auth.html" class="btn btn-lg btn-outline" style="border-color:#fff;color:#fff;background:rgba(255,255,255,.15)" data-i18n="hero.signup"></a>
      </div>
    </section>

    <div class="container">
      <div class="feature-grid">
        <div class="feature">
          <div class="icon">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          </div>
          <h3 data-i18n="feat.levels.title"></h3>
          <p data-i18n="feat.levels.desc"></p>
        </div>
        <div class="feature">
          <div class="icon">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          </div>
          <h3 data-i18n="feat.subjects.title"></h3>
          <p data-i18n="feat.subjects.desc"></p>
        </div>
        <div class="feature">
          <div class="icon">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
          </div>
          <h3 data-i18n="feat.free.title"></h3>
          <p data-i18n="feat.free.desc"></p>
        </div>
        <div class="feature">
          <div class="icon">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </div>
          <h3 data-i18n="feat.fav.title"></h3>
          <p data-i18n="feat.fav.desc"></p>
        </div>
      </div>
    </div>
  </main>

  <footer id="footer"></footer>

  <script src="config.js?v=2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/i18n.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      initSupabase();
      const { profile } = await getAuth();
      renderNavbar(profile);
      applyLang();
    });
  </script>
</body>
</html>
