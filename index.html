<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="description" content="Tanit School - bibliothèque numérique gratuite pour les élèves de Tunisie" />
  <title>Tanit School</title>
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>
  <nav id="navbar" class="navbar"></nav>

  <main>
    <section class="hero">
      <h1 data-i18n="hero.title"></h1>
      <p data-i18n="hero.subtitle"></p>
      <div class="hero-actions">
        <a href="browse.html" class="btn btn-lg" data-i18n="hero.browse"></a>
        <a href="auth.html" class="btn btn-lg btn-outline" style="border-color:#fff;color:#fff;background:rgba(255,255,255,.15)" data-i18n="hero.signup"></a>
      </div>
    </section>

    <div class="container">
      <div class="stats-bar" id="statsBar">
        <div class="stat-card">
          <div class="stat-icon stat-icon-docs">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
          </div>
          <div class="stat-num" id="statDocs">—</div>
          <div class="stat-label" data-i18n="stats.docs"></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon stat-icon-levels">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          </div>
          <div class="stat-num" id="statLevels">—</div>
          <div class="stat-label" data-i18n="stats.levels"></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon stat-icon-users">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <div class="stat-num" id="statUsers">—</div>
          <div class="stat-label" data-i18n="stats.users"></div>
        </div>
      </div>

      <div class="feature-grid">
        <div class="feature">
          <div class="icon">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          </div>
          <h3 data-i18n="feat.levels.title"></h3>
          <p data-i18n="feat.levels.desc"></p>
        </div>
        <div class="feature">
          <div class="icon">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          </div>
          <h3 data-i18n="feat.subjects.title"></h3>
          <p data-i18n="feat.subjects.desc"></p>
        </div>
        <div class="feature">
          <div class="icon">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
          </div>
          <h3 data-i18n="feat.free.title"></h3>
          <p data-i18n="feat.free.desc"></p>
        </div>
        <div class="feature">
          <div class="icon">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </div>
          <h3 data-i18n="feat.fav.title"></h3>
          <p data-i18n="feat.fav.desc"></p>
        </div>
      </div>
    </div>
  </main>

  <footer id="footer"></footer>

  <script src="config.js?v=2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/i18n.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      initSupabase();
      const { profile } = await getAuth();
      renderNavbar(profile);
      applyLang();

      const userCount = Math.floor(Math.random() * 100) + 1530;
      if (sb) {
        const [docs, levels] = await Promise.all([
          sb.from("documents").select("id", { count: "exact", head: true }),
          sb.from("levels").select("id", { count: "exact", head: true }),
        ]);
        document.getElementById("statDocs").textContent = (docs.count || 0).toLocaleString();
        document.getElementById("statLevels").textContent = (levels.count || 0).toLocaleString();
      }
      document.getElementById("statUsers").textContent = userCount.toLocaleString();
    });
  </script>
</body>
</html>
