<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favoris - Tanit School</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="navbar" class="navbar"></nav>

  <main class="container">
    <div class="page-head">
      <h1 data-i18n="fav.title"></h1>
      <p data-i18n="fav.subtitle"></p>
    </div>
    <div id="results" class="card-row"></div>
    <div id="emptyState" class="empty hidden">
      <div class="big">⭐</div>
      <p data-i18n="fav.empty"></p>
      <a href="browse.html" class="btn" data-i18n="fav.go_browse"></a>
    </div>
  </main>

  <footer id="footer"></footer>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      initSupabase();
      applyLang();
      const auth = await requireRole(null);
      if (!auth) return;
      renderNavbar(auth.profile);

      const [levels, subjects] = await Promise.all([fetchLevels(), fetchSubjects()]);
      const favIds = await loadFavIds();

      const { data: favs } = await sb.from("favorites").select("document_id").eq("user_id", auth.session.user.id);
      const ids = (favs || []).map((f) => f.document_id);
      const results = document.getElementById("results");
      const empty = document.getElementById("emptyState");

      if (!ids.length) {
        empty.classList.remove("hidden");
        return;
      }
      const { data: docs } = await sb.from("documents").select("*").in("id", ids).order("created_at", { ascending: false });
      (docs || []).forEach((d) => results.appendChild(docCard(d, levels, subjects, favIds, true)));
    });
  </script>
</body>
</html>
