<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Document - Tanit School</title>
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>
  <nav id="navbar" class="navbar"></nav>

  <main class="container">
    <div id="content">
      <div class="card">
        <div class="skeleton" style="height:60vh"></div>
      </div>
    </div>
  </main>

  <footer id="footer"></footer>

  <script src="config.js?v=2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/i18n.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      initSupabase();
      applyLang();
      const { session, profile } = await getAuth();
      renderNavbar(profile);

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      if (!id) { window.location.href = "browse.html"; return; }

      const { data: doc, error } = await sb.from("documents").select("*").eq("id", id).maybeSingle();
      const content = document.getElementById("content");
      if (error || !doc) {
        content.innerHTML = `<div class="card empty"><div class="big">⚠️</div><p>${t("misc.error")}</p></div>`;
        return;
      }

      const [levels, subjects, sections, docTypes] = await Promise.all([fetchLevels(), fetchSubjects(), fetchSections(), fetchDocTypes()]);
      const level = levels.find((l) => l.id === doc.level_id);
      const subject = subjects.find((s) => s.id === doc.subject_id);
      const section = sections.find((s) => s.id === doc.section_id);
      const lang = getLang();
      const title = doc[`title_${lang}`] || doc.title_fr;
      const desc = doc[`desc_${lang}`] || doc.desc_fr;

      // Uploader name
      let uploader = t("doc.unknown");
      if (doc.uploader_id) {
        const { data: up } = await sb.from("profiles").select("full_name, email").eq("id", doc.uploader_id).maybeSingle();
        if (up) uploader = up.full_name || up.email;
      }

      let faved = false;
      if (session) {
        const { data: fav } = await sb.from("favorites").select("id").eq("user_id", session.user.id).eq("document_id", doc.id).maybeSingle();
        faved = !!fav;
      }

      content.innerHTML = `
        <div class="doc-view-head">
          <div>
            <a href="browse.html" class="btn btn-ghost btn-sm" style="margin-bottom:10px">&larr; ${t("misc.back")}</a>
            <h1>${escapeHtml(title)}</h1>
            <div class="doc-meta" style="margin-top:10px">
              ${doc.doc_type_id ? `<span class="chip">${escapeHtml(docTypeLabel(doc, docTypes))}</span>` : ""}
              ${level ? `<span class="chip primary">${escapeHtml(level[`name_${lang}`] || level.name_fr)}</span>` : ""}
              ${subject ? `<span class="chip accent">${escapeHtml(subject[`name_${lang}`] || subject.name_fr)}</span>` : ""}
              ${section ? `<span class="chip neutral">${escapeHtml(section[`name_${lang}`] || section.name_fr)}</span>` : ""}
              <span class="chip">${t("doc.uploaded_by")}: ${escapeHtml(uploader)}</span>
            </div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button id="favBtn" class="btn btn-outline ${faved ? "faved" : ""}" ${session ? "" : "disabled"}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="${faved ? "#eab308" : "none"}" stroke="currentColor" stroke-width="2"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
              <span id="favLabel">${faved ? t("doc.remove_fav") : t("doc.add_fav")}</span>
            </button>
            <a class="btn" href="${driveDownloadUrl(doc.drive_url)}" target="_blank" rel="noopener">${t("doc.download")}</a>
            <a class="btn btn-accent" href="${driveOpenUrl(doc.drive_url)}" target="_blank" rel="noopener">${t("doc.open_drive")}</a>
          </div>
        </div>
        ${desc ? `<p style="margin-bottom:14px;color:var(--muted)">${escapeHtml(desc)}</p>` : ""}
        <iframe class="pdf-frame" src="${drivePreviewUrl(doc.drive_url)}" frameborder="0" allow="autoplay" allowfullscreen></iframe>`;

      const favBtn = document.getElementById("favBtn");
      if (favBtn && session) {
        favBtn.addEventListener("click", async () => {
          await toggleFavorite(doc.id, favBtn);
          const nowFaved = favBtn.classList.contains("faved");
          favBtn.querySelector("svg").setAttribute("fill", nowFaved ? "#eab308" : "none");
          document.getElementById("favLabel").textContent = nowFaved ? t("doc.remove_fav") : t("doc.add_fav");
        });
      }
    });
  </script>
</body>
</html>
