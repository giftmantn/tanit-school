<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Espace enseignant - Tanit School</title>
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>
  <nav id="navbar" class="navbar"></nav>

  <main class="container">
    <div class="page-head">
      <h1 data-i18n="teacher.title"></h1>
      <p data-i18n="teacher.subtitle"></p>
    </div>

    <div class="dash-grid">
      <aside class="dash-side">
        <nav class="dash-nav">
          <a class="link active" href="teacher.html" data-i18n="teacher.upload.title"></a>
          <a class="link" href="#myDocs" id="goMyDocs" data-i18n="teacher.my_docs"></a>
        </nav>
      </aside>

      <section>
        <div id="alertBox" class="alert"></div>

        <div class="card" id="uploadCard">
          <h2 data-i18n="teacher.upload.title" style="margin-bottom:18px"></h2>
          <form id="docForm">
            <input type="hidden" id="docId" />
            <div class="field-group">
              <div class="field-group-head">
                <label data-i18n="teacher.doc.titles"></label>
                <button type="button" id="autoTitles" class="btn btn-sm btn-ghost" data-i18n="teacher.doc.auto_translate"></button>
              </div>
              <div class="field">
                <label data-i18n="teacher.doc.title_fr"></label>
                <input type="text" id="titleFr" class="input" required />
              </div>
              <div class="field">
                <label data-i18n="teacher.doc.title_ar"></label>
                <input type="text" id="titleAr" class="input" required />
              </div>
              <div class="field">
                <label data-i18n="teacher.doc.title_en"></label>
                <input type="text" id="titleEn" class="input" required />
              </div>
            </div>
            <div class="field-group">
              <div class="field-group-head">
                <label data-i18n="teacher.doc.descriptions"></label>
                <button type="button" id="autoDescs" class="btn btn-sm btn-ghost" data-i18n="teacher.doc.auto_translate"></button>
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                <div class="field">
                  <label data-i18n="teacher.doc.desc_fr"></label>
                  <textarea id="descFr" class="input" required></textarea>
                </div>
                <div class="field">
                  <label data-i18n="teacher.doc.desc_ar"></label>
                  <textarea id="descAr" class="input" required></textarea>
                </div>
              </div>
              <div class="field">
                <label data-i18n="teacher.doc.desc_en"></label>
                <textarea id="descEn" class="input" required></textarea>
              </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
              <div class="field">
                <label data-i18n="teacher.doc.level"></label>
                <select id="levelSelect" class="input" required></select>
              </div>
              <div class="field" id="sectionField" style="display:none">
                <label data-i18n="teacher.doc.section"></label>
                <select id="sectionSelect" class="input"></select>
              </div>
            </div>
            <div class="field">
              <label data-i18n="teacher.doc.subject"></label>
              <select id="subjectSelect" class="input" required></select>
            </div>
            <div class="field">
              <label data-i18n="teacher.doc.type"></label>
              <select id="docType" class="input"></select>
            </div>
            <div class="field">
              <label data-i18n="teacher.doc.drive_url"></label>
              <input type="url" id="driveUrl" class="input" placeholder="https://drive.google.com/file/d/..." required />
              <small style="color:var(--muted)" data-i18n="teacher.doc.drive_help"></small>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap">
              <button type="submit" class="btn" id="submitBtn" data-i18n="teacher.doc.submit"></button>
              <button type="button" class="btn btn-ghost hidden" id="cancelEdit" data-i18n="admin.cancel"></button>
            </div>
          </form>
        </div>

        <div class="card" id="myDocs" style="margin-top:20px">
          <h2 data-i18n="teacher.my_docs" style="margin-bottom:16px"></h2>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th data-i18n="admin.doc.title_fr"></th>
                  <th data-i18n="teacher.doc.level"></th>
                  <th data-i18n="teacher.doc.subject"></th>
                  <th data-i18n="teacher.doc.section"></th>
                  <th data-i18n="admin.actions"></th>
                </tr>
              </thead>
              <tbody id="docsBody"></tbody>
            </table>
          </div>
          <div id="noDocs" class="empty" style="display:none;padding:30px 10px">
            <p data-i18n="teacher.doc.no_docs"></p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer id="footer"></footer>

  <script src="config.js?v=2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/i18n.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
  <script>
    let auth = null;
    let levels = [];
    let subjects = [];
    let sections = [];
    let sectionsByLevel = {};
    let subjectsByLevel = {};
    let subjectsBySection = {};
    let docTypes = [];
    let editingId = null;

    document.addEventListener("DOMContentLoaded", async () => {
      initSupabase();
      applyLang();
      auth = await requireRole(["teacher", "admin"]);
      if (!auth) return;
      renderNavbar(auth.profile);

      const [l, s, sec, dt, ls, lsub, ssub] = await Promise.all([fetchLevels(), fetchSubjects(), fetchSections(), fetchDocTypes(), fetchLevelSections(), fetchLevelSubjects(), fetchSectionSubjects()]);
      levels = l;
      subjects = s;
      sections = sec;
      docTypes = dt;
      sectionsByLevel = ls;
      subjectsByLevel = lsub;
      subjectsBySection = ssub;

      const levelSel = document.getElementById("levelSelect");
      const subjectSel = document.getElementById("subjectSelect");
      const docTypeSel = document.getElementById("docType");
      levelSel.innerHTML = optionList(levels, null, (x) => x[`name_${getLang()}`] || x.name_fr);
      docTypeSel.innerHTML = `<option value="">${t("browse.all_types")}</option>` +
        docTypes.map((dt) => `<option value="${dt.id}">${escapeHtml(dt[`name_${getLang()}`] || dt.name_fr)}</option>`).join("");
      updateSubjectSelect();
      levelSel.addEventListener("change", () => { updateSectionSelect(); updateSubjectSelect(); });
      updateSectionSelect();
      document.getElementById("sectionSelect").addEventListener("change", () => updateSubjectSelect());

      await loadMyDocs();

      document.getElementById("goMyDocs").addEventListener("click", () => {
        document.getElementById("myDocs").scrollIntoView({ behavior: "smooth" });
      });

      document.getElementById("docForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        clearAlert("alertBox");
        const url = document.getElementById("driveUrl").value.trim();
        if (!isValidDriveUrl(url)) {
          showAlert("alertBox", t("teacher.invalid_drive"), "error");
          return;
        }
        const levelId = levelSel.value;
        const secIds = sectionsByLevel[levelId] || [];
        const sectionId = document.getElementById("sectionSelect").value || null;
        if (secIds.length && !sectionId) {
          showAlert("alertBox", t("teacher.doc.section_required"), "error");
          return;
        }
        const payload = {
          title_fr: document.getElementById("titleFr").value.trim(),
          title_ar: document.getElementById("titleAr").value.trim(),
          title_en: document.getElementById("titleEn").value.trim(),
          desc_fr: document.getElementById("descFr").value.trim(),
          desc_ar: document.getElementById("descAr").value.trim(),
          desc_en: document.getElementById("descEn").value.trim(),
          doc_type_id: document.getElementById("docType").value || null,
          level_id: levelId,
          subject_id: subjectSel.value,
          section_id: sectionId,
          drive_url: url,
        };

        if (editingId) {
          const { error } = await sb.from("documents").update(payload).eq("id", editingId);
          if (error) { showAlert("alertBox", t("misc.error") + " (" + error.message + ")", "error"); return; }
          showAlert("alertBox", t("teacher.doc.updated"), "success");
          resetForm();
        } else {
          const { error } = await sb.from("documents").insert({ ...payload, uploader_id: auth.session.user.id });
          if (error) { showAlert("alertBox", t("misc.error") + " (" + error.message + ")", "error"); return; }
          showAlert("alertBox", t("teacher.doc.added"), "success");
          resetForm();
        }
        await loadMyDocs();
      });

      document.getElementById("cancelEdit").addEventListener("click", resetForm);
    });

    // Auto-translate the empty language fields as the teacher types in one language.
    // Only empty fields are filled, so manual text is never overwritten.
    // Fires on input (debounced) and on blur (leaving the field).
    function scheduleTranslate(sourceId, fromLang, targets) {
      clearTimeout(window.__transTimer);
      window.__transTimer = setTimeout(async () => {
        const text = document.getElementById(sourceId).value.trim();
        if (!text) return;
        for (const t of targets) {
          const el = document.getElementById(t.id);
          if (el.value.trim()) continue;
          const out = await translateText(text, fromLang, t.lang);
          if (out) el.value = out;
        }
      }, 700);
    }

    function wireAutoTranslate(sourceId, fromLang, targets) {
      const src = document.getElementById(sourceId);
      src.addEventListener("input", () => scheduleTranslate(sourceId, fromLang, targets));
      src.addEventListener("blur", () => scheduleTranslate(sourceId, fromLang, targets));
    }

    wireAutoTranslate("titleFr", "fr", [{ id: "titleAr", lang: "ar" }, { id: "titleEn", lang: "en" }]);
    wireAutoTranslate("titleAr", "ar", [{ id: "titleFr", lang: "fr" }, { id: "titleEn", lang: "en" }]);
    wireAutoTranslate("titleEn", "en", [{ id: "titleFr", lang: "fr" }, { id: "titleAr", lang: "ar" }]);
    wireAutoTranslate("descFr", "fr", [{ id: "descAr", lang: "ar" }, { id: "descEn", lang: "en" }]);
    wireAutoTranslate("descAr", "ar", [{ id: "descFr", lang: "fr" }, { id: "descEn", lang: "en" }]);
    wireAutoTranslate("descEn", "en", [{ id: "descFr", lang: "fr" }, { id: "descAr", lang: "ar" }]);

    // "Auto" buttons: fill every empty field of a group from the first filled one.
    const TITLE_FIELDS = [
      { id: "titleFr", lang: "fr" },
      { id: "titleAr", lang: "ar" },
      { id: "titleEn", lang: "en" },
    ];
    const DESC_FIELDS = [
      { id: "descFr", lang: "fr" },
      { id: "descAr", lang: "ar" },
      { id: "descEn", lang: "en" },
    ];

    async function autoTranslateGroup(fields, btn) {
      const source = fields.find((f) => document.getElementById(f.id).value.trim());
      const empty = fields.filter((f) => !document.getElementById(f.id).value.trim());
      if (!source) {
        showAlert("alertBox", t("teacher.doc.auto_none"), "error");
        return;
      }
      if (!empty.length) {
        showAlert("alertBox", t("teacher.doc.auto_done"), "success");
        return;
      }
      btn.disabled = true;
      btn.textContent = "…";
      const srcText = document.getElementById(source.id).value.trim();
      for (const f of empty) {
        const out = await translateText(srcText, source.lang, f.lang);
        if (out) document.getElementById(f.id).value = out;
      }
      btn.disabled = false;
      btn.textContent = t("teacher.doc.auto_translate");
      showAlert("alertBox", t("teacher.doc.auto_done"), "success");
    }

    document.getElementById("autoTitles").addEventListener("click", function () {
      autoTranslateGroup(TITLE_FIELDS, this);
    });
    document.getElementById("autoDescs").addEventListener("click", function () {
      autoTranslateGroup(DESC_FIELDS, this);
    });

    // Show the section select only when the chosen level has sections.
    function updateSectionSelect() {
      const field = document.getElementById("sectionField");
      const sel = document.getElementById("sectionSelect");
      const levelId = document.getElementById("levelSelect").value;
      const secIds = sectionsByLevel[levelId] || [];
      sel.value = "";
      if (secIds.length) {
        const available = sections.filter((s) => secIds.includes(s.id));
        sel.innerHTML = optionList(available, null, (s) => s[`name_${getLang()}`] || s.name_fr);
        field.style.display = "";
      } else {
        sel.innerHTML = "";
        field.style.display = "none";
      }
    }

    // Restrict the subject list to the subjects offered by the chosen level
    // and section. A section's subject list takes precedence over the level's;
    // falls back to all subjects when neither restricts. keepId preserves an
    // already-chosen subject when editing.
    function updateSubjectSelect(keepId) {
      const sel = document.getElementById("subjectSelect");
      const levelId = document.getElementById("levelSelect").value;
      const sectionId = document.getElementById("sectionSelect").value;
      let ids = [];
      if (sectionId && (subjectsBySection[sectionId] || []).length) {
        ids = subjectsBySection[sectionId];
      } else if (levelId && (subjectsByLevel[levelId] || []).length) {
        ids = subjectsByLevel[levelId];
      }
      let list = ids.length ? subjects.filter((s) => ids.includes(s.id)) : subjects;
      if (keepId && !list.some((s) => s.id === keepId)) {
        const extra = subjects.find((s) => s.id === keepId);
        if (extra) list = [...list, extra];
      }
      sel.innerHTML = optionList(list, keepId || null, (s) => s[`name_${getLang()}`] || s.name_fr);
    }

    async function loadMyDocs() {
      const { data } = await sb
        .from("documents")
        .select("*")
        .eq("uploader_id", auth.session.user.id)
        .order("created_at", { ascending: false });
      const tbody = document.getElementById("docsBody");
      const noDocs = document.getElementById("noDocs");
      tbody.innerHTML = "";
      noDocs.style.display = (data && data.length) ? "none" : "block";
      (data || []).forEach((d) => {
        const level = levels.find((l) => l.id === d.level_id);
        const subject = subjects.find((s) => s.id === d.subject_id);
        const section = sections.find((s) => s.id === d.section_id);
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(d.title_fr)}</td>
          <td>${escapeHtml(level ? (level[`name_${getLang()}`] || level.name_fr) : "-")}</td>
          <td>${escapeHtml(subject ? (subject[`name_${getLang()}`] || subject.name_fr) : "-")}</td>
          <td>${escapeHtml(section ? (section[`name_${getLang()}`] || section.name_fr) : "-")}</td>
          <td>
            <div class="actions">
              <button class="btn btn-sm btn-ghost" data-act="edit" data-id="${d.id}">${t("teacher.edit")}</button>
              <button class="btn btn-sm btn-accent" data-act="del" data-id="${d.id}">${t("teacher.delete")}</button>
            </div>
          </td>`;
        tr.querySelector('[data-act="edit"]').addEventListener("click", () => editDoc(d));
        tr.querySelector('[data-act="del"]').addEventListener("click", async () => {
          if (!confirm(t("misc.confirm_delete"))) return;
          await sb.from("documents").delete().eq("id", d.id);
          showAlert("alertBox", t("teacher.doc.deleted"), "success");
          await loadMyDocs();
        });
        tbody.appendChild(tr);
      });
    }

    function editDoc(d) {
      editingId = d.id;
      document.getElementById("docId").value = d.id;
      document.getElementById("titleFr").value = d.title_fr;
      document.getElementById("titleAr").value = d.title_ar;
      document.getElementById("titleEn").value = d.title_en;
      document.getElementById("descFr").value = d.desc_fr || "";
      document.getElementById("descAr").value = d.desc_ar || "";
      document.getElementById("descEn").value = d.desc_en || "";
      document.getElementById("docType").value = d.doc_type_id || "";
      document.getElementById("levelSelect").value = d.level_id;
      updateSectionSelect();
      document.getElementById("sectionSelect").value = d.section_id || "";
      updateSubjectSelect(d.subject_id);
      document.getElementById("driveUrl").value = d.drive_url;
      document.getElementById("submitBtn").textContent = t("admin.save");
      document.getElementById("cancelEdit").classList.remove("hidden");
      document.getElementById("uploadCard").scrollIntoView({ behavior: "smooth" });
    }

    function resetForm() {
      editingId = null;
      document.getElementById("docForm").reset();
      updateSectionSelect();
      updateSubjectSelect();
      document.getElementById("submitBtn").textContent = t("teacher.doc.submit");
      document.getElementById("cancelEdit").classList.add("hidden");
    }
  </script>
</body>
</html>
