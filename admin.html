<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration - Tanit School</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="navbar" class="navbar"></nav>

  <main class="container">
    <div class="page-head">
      <h1 data-i18n="admin.title"></h1>
      <p data-i18n="admin.subtitle"></p>
    </div>

    <div class="tabs">
      <button data-tab="users" class="active" data-i18n="admin.tab.users"></button>
      <button data-tab="documents" data-i18n="admin.tab.documents"></button>
      <button data-tab="levels" data-i18n="admin.tab.levels"></button>
      <button data-tab="subjects" data-i18n="admin.tab.subjects"></button>
      <button data-tab="sections" data-i18n="admin.tab.sections"></button>
    </div>

    <div id="alertBox" class="alert"></div>

    <!-- USERS -->
    <div id="tab-users">
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th data-i18n="admin.users.name"></th>
              <th data-i18n="admin.users.email"></th>
              <th data-i18n="admin.users.role"></th>
              <th data-i18n="admin.users.status"></th>
              <th data-i18n="admin.users.created"></th>
              <th data-i18n="admin.actions"></th>
            </tr>
          </thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </div>

    <!-- DOCUMENTS -->
    <div id="tab-documents" class="hidden">
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th data-i18n="admin.doc.title_fr"></th>
              <th data-i18n="admin.doc.level"></th>
              <th data-i18n="admin.doc.subject"></th>
              <th data-i18n="admin.published"></th>
              <th data-i18n="admin.actions"></th>
            </tr>
          </thead>
          <tbody id="docsBody"></tbody>
        </table>
      </div>
    </div>

    <!-- LEVELS -->
    <div id="tab-levels" class="hidden">
      <div class="card" style="margin-bottom:20px">
        <form id="levelForm" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end">
          <div class="field" style="margin:0">
            <label data-i18n="admin.level.name_fr"></label>
            <input type="text" id="levelFr" class="input" required />
          </div>
          <div class="field" style="margin:0">
            <label data-i18n="admin.level.name_ar"></label>
            <input type="text" id="levelAr" class="input" required />
          </div>
          <div class="field" style="margin:0">
            <label data-i18n="admin.level.name_en"></label>
            <input type="text" id="levelEn" class="input" required />
          </div>
          <div class="field" style="margin:0">
            <label data-i18n="admin.level.order"></label>
            <input type="number" id="levelOrd" class="input" value="0" />
          </div>
          <button type="submit" class="btn" data-i18n="admin.add"></button>
        </form>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th data-i18n="admin.level.name_fr"></th>
              <th data-i18n="admin.level.name_ar"></th>
              <th data-i18n="admin.level.name_en"></th>
              <th data-i18n="admin.level.order"></th>
              <th data-i18n="admin.actions"></th>
            </tr>
          </thead>
          <tbody id="levelsBody"></tbody>
        </table>
      </div>
    </div>

    <!-- SUBJECTS -->
    <div id="tab-subjects" class="hidden">
      <div class="card" style="margin-bottom:20px">
        <form id="subjectForm" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end">
          <div class="field" style="margin:0">
            <label data-i18n="admin.subject.name_fr"></label>
            <input type="text" id="subjectFr" class="input" required />
          </div>
          <div class="field" style="margin:0">
            <label data-i18n="admin.subject.name_ar"></label>
            <input type="text" id="subjectAr" class="input" required />
          </div>
          <div class="field" style="margin:0">
            <label data-i18n="admin.subject.name_en"></label>
            <input type="text" id="subjectEn" class="input" required />
          </div>
          <div class="field" style="margin:0">
            <label data-i18n="admin.subject.order"></label>
            <input type="number" id="subjectOrd" class="input" value="0" />
          </div>
          <button type="submit" class="btn" data-i18n="admin.add"></button>
        </form>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th data-i18n="admin.subject.name_fr"></th>
              <th data-i18n="admin.subject.name_ar"></th>
              <th data-i18n="admin.subject.name_en"></th>
              <th data-i18n="admin.level.order"></th>
              <th data-i18n="admin.actions"></th>
            </tr>
          </thead>
          <tbody id="subjectsBody"></tbody>
        </table>
      </div>
    </div>
    <!-- SECTIONS -->
    <div id="tab-sections" class="hidden">
      <div class="card" style="margin-bottom:20px">
        <form id="sectionForm" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end">
          <div class="field" style="margin:0">
            <label data-i18n="admin.section.name_fr"></label>
            <input type="text" id="sectionFr" class="input" required />
          </div>
          <div class="field" style="margin:0">
            <label data-i18n="admin.section.name_ar"></label>
            <input type="text" id="sectionAr" class="input" required />
          </div>
          <div class="field" style="margin:0">
            <label data-i18n="admin.section.name_en"></label>
            <input type="text" id="sectionEn" class="input" required />
          </div>
          <div class="field" style="margin:0">
            <label data-i18n="admin.section.order"></label>
            <input type="number" id="sectionOrd" class="input" value="0" />
          </div>
          <button type="submit" class="btn" data-i18n="admin.add"></button>
        </form>
        <div class="field" style="margin-top:12px">
          <label data-i18n="admin.section.levels"></label>
          <div id="sectionLevelBox" style="display:flex;flex-wrap:wrap;gap:10px"></div>
        </div>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th data-i18n="admin.section.name_fr"></th>
              <th data-i18n="admin.section.name_ar"></th>
              <th data-i18n="admin.section.name_en"></th>
              <th data-i18n="admin.section.order"></th>
              <th data-i18n="admin.section.levels"></th>
              <th data-i18n="admin.actions"></th>
            </tr>
          </thead>
          <tbody id="sectionsBody"></tbody>
        </table>
      </div>
    </div>

    <!-- LEVEL SUBJECTS MODAL -->
    <div id="levelSubjectsModal" class="modal hidden">
      <div class="modal-box">
        <h3 id="levelSubjectsTitle"></h3>
        <div id="levelSubjectsBox" class="subj-check-grid"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="levelSubjectsCancel" data-i18n="admin.cancel"></button>
          <button type="button" class="btn" id="levelSubjectsSave" data-i18n="admin.save"></button>
        </div>
      </div>
    </div>
  </main>

  <footer id="footer"></footer>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script>
    let auth = null;
    let levels = [];
    let subjects = [];
    let sections = [];
    let sectionsByLevel = {};
    let subjectsByLevel = {};
    let editingLevelId = null;

    document.addEventListener("DOMContentLoaded", async () => {
      initSupabase();
      applyLang();
      auth = await requireRole("admin");
      if (!auth) return;
      renderNavbar(auth.profile);

      // Tabs
      document.querySelectorAll(".tabs button").forEach((b) => {
        b.addEventListener("click", () => {
          document.querySelectorAll(".tabs button").forEach((x) => x.classList.remove("active"));
          b.classList.add("active");
          ["users", "documents", "levels", "subjects", "sections"].forEach((tab) => {
            document.getElementById("tab-" + tab).classList.toggle("hidden", tab !== b.dataset.tab);
          });
        });
      });

      await loadAll();

      document.getElementById("levelForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        clearAlert("alertBox");
        const payload = {
          name_fr: document.getElementById("levelFr").value.trim(),
          name_ar: document.getElementById("levelAr").value.trim(),
          name_en: document.getElementById("levelEn").value.trim(),
          ord: parseInt(document.getElementById("levelOrd").value, 10) || 0,
        };
        const { error } = await sb.from("levels").insert(payload);
        if (error) { showAlert("alertBox", t("misc.error") + " (" + error.message + ")", "error"); return; }
        e.target.reset();
        showAlert("alertBox", t("admin.saved"), "success");
        levels = await fetchLevels();
        renderLevels();
      });

      document.getElementById("subjectForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        clearAlert("alertBox");
        const payload = {
          name_fr: document.getElementById("subjectFr").value.trim(),
          name_ar: document.getElementById("subjectAr").value.trim(),
          name_en: document.getElementById("subjectEn").value.trim(),
          ord: parseInt(document.getElementById("subjectOrd").value, 10) || 0,
        };
        const { error } = await sb.from("subjects").insert(payload);
        if (error) { showAlert("alertBox", t("misc.error") + " (" + error.message + ")", "error"); return; }
        e.target.reset();
        showAlert("alertBox", t("admin.saved"), "success");
        subjects = await fetchSubjects();
        renderSubjects();
      });

      document.getElementById("sectionForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        clearAlert("alertBox");
        const payload = {
          name_fr: document.getElementById("sectionFr").value.trim(),
          name_ar: document.getElementById("sectionAr").value.trim(),
          name_en: document.getElementById("sectionEn").value.trim(),
          ord: parseInt(document.getElementById("sectionOrd").value, 10) || 0,
        };
        const { data: sec, error } = await sb.from("sections").insert(payload).select().single();
        if (error) { showAlert("alertBox", t("misc.error") + " (" + error.message + ")", "error"); return; }
        const levelIds = [...document.querySelectorAll("#sectionLevelBox input:checked")].map((i) => i.value);
        if (levelIds.length) {
          const { error: jerr } = await sb.from("level_sections").insert(
            levelIds.map((level_id) => ({ level_id, section_id: sec.id }))
          );
          if (jerr) { showAlert("alertBox", t("misc.error") + " (" + jerr.message + ")", "error"); return; }
        }
        e.target.reset();
        showAlert("alertBox", t("admin.saved"), "success");
        sections = await fetchSections();
        sectionsByLevel = await fetchLevelSections();
        renderSections();
        renderSectionLevelChecks();
      });

      document.getElementById("levelSubjectsCancel").addEventListener("click", closeLevelSubjects);
      document.getElementById("levelSubjectsSave").addEventListener("click", saveLevelSubjects);
      document.getElementById("levelSubjectsModal").addEventListener("click", (e) => {
        if (e.target === e.currentTarget) closeLevelSubjects();
      });
    });

    function openLevelSubjects(levelId) {
      editingLevelId = levelId;
      const level = levels.find((l) => l.id === levelId);
      if (!level) return;
      document.getElementById("levelSubjectsTitle").textContent =
        t("admin.level.subjects_title") + " — " + (level[`name_${getLang()}`] || level.name_fr);
      const assigned = subjectsByLevel[levelId] || [];
      document.getElementById("levelSubjectsBox").innerHTML = subjects.map((s) => `
        <label>
          <input type="checkbox" value="${s.id}" ${assigned.includes(s.id) ? "checked" : ""} />
          ${escapeHtml(s[`name_${getLang()}`] || s.name_fr)}
        </label>`).join("") || `<span style="color:var(--muted)">-</span>`;
      document.getElementById("levelSubjectsModal").classList.remove("hidden");
    }

    function closeLevelSubjects() {
      document.getElementById("levelSubjectsModal").classList.add("hidden");
      editingLevelId = null;
    }

    async function saveLevelSubjects() {
      const levelId = editingLevelId;
      if (!levelId) return;
      const checked = [...document.querySelectorAll("#levelSubjectsBox input:checked")].map((i) => i.value);
      const existing = new Set(subjectsByLevel[levelId] || []);
      const toAdd = checked.filter((id) => !existing.has(id));
      const toRemove = [...existing].filter((id) => !checked.includes(id));
      if (toAdd.length) {
        const { error } = await sb.from("level_subjects").insert(
          toAdd.map((subject_id) => ({ level_id: levelId, subject_id }))
        );
        if (error) { showAlert("alertBox", t("misc.error") + " (" + error.message + ")", "error"); return; }
      }
      if (toRemove.length) {
        const { error } = await sb.from("level_subjects").delete().eq("level_id", levelId).in("subject_id", toRemove);
        if (error) { showAlert("alertBox", t("misc.error") + " (" + error.message + ")", "error"); return; }
      }
      subjectsByLevel = await fetchLevelSubjects();
      renderLevels();
      closeLevelSubjects();
      showAlert("alertBox", t("admin.saved"), "success");
    }

    async function loadAll() {
      const [l, s, sec, ls, lsub] = await Promise.all([fetchLevels(), fetchSubjects(), fetchSections(), fetchLevelSections(), fetchLevelSubjects()]);
      levels = l;
      subjects = s;
      sections = sec;
      sectionsByLevel = ls;
      subjectsByLevel = lsub;
      await Promise.all([loadUsers(), loadDocs(), renderLevels(), renderSubjects(), renderSections(), renderSectionLevelChecks()]);
    }

    async function loadUsers() {
      const { data } = await sb.from("profiles").select("*").order("created_at", { ascending: false });
      const tbody = document.getElementById("usersBody");
      tbody.innerHTML = "";
      (data || []).forEach((u) => {
        const tr = document.createElement("tr");
        const statusKey = "status." + (u.status || "pending");
        tr.innerHTML = `
          <td>${escapeHtml(u.full_name || "-")}${u.id === auth.session.user.id ? " " + t("admin.me") : ""}</td>
          <td>${escapeHtml(u.email || "-")}</td>
          <td>
            <select class="input role-sel" data-id="${u.id}" style="padding:6px 10px;width:auto">
              <option value="student" ${u.role === "student" ? "selected" : ""}>${t("role.student")}</option>
              <option value="teacher" ${u.role === "teacher" ? "selected" : ""}>${t("role.teacher")}</option>
              <option value="admin" ${u.role === "admin" ? "selected" : ""}>${t("role.admin")}</option>
            </select>
          </td>
          <td>
            <span class="chip ${u.status === "approved" ? "primary" : u.status === "rejected" ? "accent" : ""}">${t(statusKey)}</span>
          </td>
          <td>${formatDate(u.created_at)}</td>
          <td>
            <div class="actions">
              <button class="btn btn-sm save-role" data-id="${u.id}">${t("admin.save")}</button>
              ${u.status !== "approved" ? `<button class="btn btn-sm approve-user" data-id="${u.id}">${t("admin.users.approve")}</button>` : ""}
              ${u.status === "approved" ? `<button class="btn btn-sm btn-accent reject-user" data-id="${u.id}">${t("admin.users.reject")}</button>` : ""}
            </div>
          </td>`;
        tr.querySelector(".save-role").addEventListener("click", async () => {
          const role = tr.querySelector(".role-sel").value;
          const { error } = await sb.from("profiles").update({ role }).eq("id", u.id);
          if (error) { showAlert("alertBox", t("misc.error") + " (" + error.message + ")", "error"); return; }
          showAlert("alertBox", t("admin.saved"), "success");
        });
        const approveBtn = tr.querySelector(".approve-user");
        if (approveBtn) {
          approveBtn.addEventListener("click", async () => {
            await sb.from("profiles").update({ status: "approved" }).eq("id", u.id);
            showAlert("alertBox", t("admin.approved_ok"), "success");
            await loadUsers();
          });
        }
        const rejectBtn = tr.querySelector(".reject-user");
        if (rejectBtn) {
          rejectBtn.addEventListener("click", async () => {
            await sb.from("profiles").update({ status: "rejected" }).eq("id", u.id);
            showAlert("alertBox", t("admin.rejected_ok"), "success");
            await loadUsers();
          });
        }
        tbody.appendChild(tr);
      });
    }

    async function loadDocs() {
      const { data } = await sb.from("documents").select("*").order("created_at", { ascending: false });
      const tbody = document.getElementById("docsBody");
      tbody.innerHTML = "";
      (data || []).forEach((d) => {
        const level = levels.find((l) => l.id === d.level_id);
        const subject = subjects.find((s) => s.id === d.subject_id);
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(d.title_fr)}</td>
          <td>${escapeHtml(level ? (level[`name_${getLang()}`] || level.name_fr) : "-")}</td>
          <td>${escapeHtml(subject ? (subject[`name_${getLang()}`] || subject.name_fr) : "-")}</td>
          <td>
            <select class="input approve-sel" data-id="${d.id}" style="padding:6px 10px;width:auto">
              <option value="true" ${d.approved ? "selected" : ""}>${t("misc.yes")}</option>
              <option value="false" ${!d.approved ? "selected" : ""}>${t("misc.no")}</option>
            </select>
          </td>
          <td>
            <div class="actions">
              <a class="btn btn-sm btn-ghost" href="document.html?id=${d.id}" target="_blank">${t("doc.view")}</a>
              <button class="btn btn-sm save-approve" data-id="${d.id}">${t("admin.save")}</button>
              <button class="btn btn-sm btn-accent del-doc" data-id="${d.id}">${t("admin.delete")}</button>
            </div>
          </td>`;
        tr.querySelector(".save-approve").addEventListener("click", async () => {
          const approved = tr.querySelector(".approve-sel").value === "true";
          await sb.from("documents").update({ approved }).eq("id", d.id);
          showAlert("alertBox", t("admin.saved"), "success");
        });
        tr.querySelector(".del-doc").addEventListener("click", async () => {
          if (!confirm(t("misc.confirm_delete"))) return;
          await sb.from("documents").delete().eq("id", d.id);
          showAlert("alertBox", t("admin.deleted"), "success");
          await loadDocs();
        });
        tbody.appendChild(tr);
      });
    }

    function renderLevels() {
      const tbody = document.getElementById("levelsBody");
      tbody.innerHTML = "";
      levels.forEach((l) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(l.name_fr)}</td>
          <td>${escapeHtml(l.name_ar)}</td>
          <td>${escapeHtml(l.name_en)}</td>
          <td>${l.ord}</td>
          <td>
            <div class="actions">
              <button class="btn btn-sm btn-ghost edit-level-subjects" data-id="${l.id}">${t("admin.edit")}</button>
              <button class="btn btn-sm btn-accent del-level" data-id="${l.id}">${t("admin.delete")}</button>
            </div>
          </td>`;
        tr.querySelector(".edit-level-subjects").addEventListener("click", () => openLevelSubjects(l.id));
        tr.querySelector(".del-level").addEventListener("click", async () => {
          if (!confirm(t("misc.confirm_delete"))) return;
          await sb.from("levels").delete().eq("id", l.id);
          levels = await fetchLevels();
          renderLevels();
          showAlert("alertBox", t("admin.deleted"), "success");
        });
        tbody.appendChild(tr);
      });
    }

    function renderSubjects() {
      const tbody = document.getElementById("subjectsBody");
      tbody.innerHTML = "";
      subjects.forEach((s) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(s.name_fr)}</td>
          <td>${escapeHtml(s.name_ar)}</td>
          <td>${escapeHtml(s.name_en)}</td>
          <td>${s.ord}</td>
          <td><button class="btn btn-sm btn-accent del-subject" data-id="${s.id}">${t("admin.delete")}</button></td>`;
        tr.querySelector(".del-subject").addEventListener("click", async () => {
          if (!confirm(t("misc.confirm_delete"))) return;
          await sb.from("subjects").delete().eq("id", s.id);
          subjects = await fetchSubjects();
          renderSubjects();
          showAlert("alertBox", t("admin.deleted"), "success");
        });
        tbody.appendChild(tr);
      });
    }
    function renderSections() {
      const tbody = document.getElementById("sectionsBody");
      tbody.innerHTML = "";
      sections.forEach((sec) => {
        const assigned = levels.filter((l) => (sectionsByLevel[l.id] || []).includes(sec.id));
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(sec.name_fr)}</td>
          <td>${escapeHtml(sec.name_ar)}</td>
          <td>${escapeHtml(sec.name_en)}</td>
          <td>${sec.ord}</td>
          <td>${assigned.length ? escapeHtml(assigned.map((l) => l[`name_${getLang()}`] || l.name_fr).join(", ")) : "-"}</td>
          <td><button class="btn btn-sm btn-accent del-section" data-id="${sec.id}">${t("admin.delete")}</button></td>`;
        tr.querySelector(".del-section").addEventListener("click", async () => {
          if (!confirm(t("misc.confirm_delete"))) return;
          await sb.from("sections").delete().eq("id", sec.id);
          sections = await fetchSections();
          sectionsByLevel = await fetchLevelSections();
          renderSections();
          renderSectionLevelChecks();
          showAlert("alertBox", t("admin.deleted"), "success");
        });
        tbody.appendChild(tr);
      });
    }

    // Checkboxes in the "add section" form: one per secondary level (2ème→4ème).
    function renderSectionLevelChecks() {
      const box = document.getElementById("sectionLevelBox");
      if (!box) return;
      const candidates = levels.filter((l) => SECTION_LEVEL_ORDS.includes(l.ord));
      box.innerHTML = candidates.map((l) => `
        <label style="display:inline-flex;align-items:center;gap:6px;font-size:.9rem">
          <input type="checkbox" value="${l.id}" checked /> ${escapeHtml(l[`name_${getLang()}`] || l.name_fr)}
        </label>`).join("") || `<span style="color:var(--muted)">-</span>`;
    }
  </script>
</body>
</html>
