<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion - Tanit School</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="navbar" class="navbar"></nav>

  <main class="container">
    <div class="auth-wrap">
      <div class="card">
        <div class="auth-tabs">
          <button id="tabLogin" class="active" data-i18n="auth.login.title"></button>
          <button id="tabSignup" data-i18n="auth.signup.title"></button>
        </div>

        <div id="alertBox" class="alert"></div>

        <!-- LOGIN FORM -->
        <form id="loginForm">
          <h2 style="margin-bottom:18px" data-i18n="auth.welcome.back"></h2>
          <div class="field">
            <label data-i18n="auth.email"></label>
            <input type="email" id="loginEmail" class="input" required />
          </div>
          <div class="field">
            <label data-i18n="auth.password"></label>
            <input type="password" id="loginPassword" class="input" required />
          </div>
          <button type="submit" class="btn btn-block btn-lg" data-i18n="auth.login.btn"></button>
          <p style="margin-top:14px;text-align:center;font-size:.9rem">
            <a href="#" id="toSignup" data-i18n="auth.no_account"></a>
          </p>
        </form>

        <!-- SIGNUP FORM -->
        <form id="signupForm" class="hidden">
          <h2 style="margin-bottom:18px" data-i18n="auth.welcome.new"></h2>
          <div class="field">
            <label data-i18n="auth.fullname"></label>
            <input type="text" id="suName" class="input" required />
          </div>
          <div class="field">
            <label data-i18n="auth.email"></label>
            <input type="email" id="suEmail" class="input" required />
          </div>
          <div class="field">
            <label data-i18n="auth.password"></label>
            <input type="password" id="suPassword" class="input" required />
          </div>
          <div class="field">
            <label data-i18n="auth.confirm_password"></label>
            <input type="password" id="suPassword2" class="input" required />
          </div>
          <div class="field">
            <label data-i18n="auth.role"></label>
            <select id="suRole" class="input">
              <option value="student" data-i18n="auth.role.student"></option>
              <option value="teacher" data-i18n="auth.role.teacher"></option>
            </select>
          </div>
          <p style="font-size:.82rem;color:var(--muted);margin-bottom:14px" data-i18n="auth.teacher_hint"></p>
          <button type="submit" class="btn btn-block btn-lg" data-i18n="auth.signup.btn"></button>
          <p style="margin-top:14px;text-align:center;font-size:.9rem">
            <a href="#" id="toLogin" data-i18n="auth.have_account"></a>
          </p>
        </form>

        <!-- OTP VERIFICATION FORM -->
        <form id="otpForm" class="hidden">
          <h2 style="margin-bottom:10px" data-i18n="auth.otp.title"></h2>
          <p style="font-size:.9rem;color:var(--muted);margin-bottom:18px">
            <span data-i18n="auth.otp.subtitle"></span>
            <strong id="otpEmail"></strong>
          </p>
          <div class="field">
            <label data-i18n="auth.otp.code"></label>
            <input type="text" id="otpCode" class="input" inputmode="numeric" maxlength="6" autocomplete="one-time-code" style="text-align:center;font-size:1.4rem;letter-spacing:8px" required />
          </div>
          <button type="submit" class="btn btn-block btn-lg" data-i18n="auth.otp.verify"></button>
          <p style="margin-top:14px;text-align:center;font-size:.9rem">
            <a href="#" id="resendCode" data-i18n="auth.otp.resend"></a>
          </p>
          <p style="margin-top:10px;text-align:center;font-size:.85rem">
            <a href="#" id="backToSignup" data-i18n="misc.back"></a>
          </p>
        </form>
      </div>
    </div>
  </main>

  <footer id="footer"></footer>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      initSupabase();
      const { session, profile } = await getAuth();
      if (session) {
        window.location.href = profile && profile.role === "admin" ? "admin.html"
          : profile && profile.role === "teacher" ? "teacher.html"
          : "browse.html";
        return;
      }
      renderNavbar(null);
      applyLang();

      const loginForm = document.getElementById("loginForm");
      const signupForm = document.getElementById("signupForm");
      const otpForm = document.getElementById("otpForm");
      const tabLogin = document.getElementById("tabLogin");
      const tabSignup = document.getElementById("tabSignup");

      function redirectByRole(role) {
        window.location.href = role === "admin" ? "admin.html"
          : role === "teacher" ? "teacher.html"
          : "browse.html";
      }

      function showLogin() {
        loginForm.classList.remove("hidden");
        signupForm.classList.add("hidden");
        otpForm.classList.add("hidden");
        tabLogin.classList.add("active");
        tabSignup.classList.remove("active");
      }
      function showSignup() {
        loginForm.classList.add("hidden");
        signupForm.classList.remove("hidden");
        otpForm.classList.add("hidden");
        tabSignup.classList.add("active");
        tabLogin.classList.remove("active");
      }
      function showOtp(email) {
        loginForm.classList.add("hidden");
        signupForm.classList.add("hidden");
        otpForm.classList.remove("hidden");
        document.getElementById("otpEmail").textContent = email;
        tabSignup.classList.add("active");
        tabLogin.classList.remove("active");
        document.getElementById("otpCode").focus();
      }

      tabLogin.addEventListener("click", showLogin);
      tabSignup.addEventListener("click", showSignup);
      document.getElementById("toSignup").addEventListener("click", (e) => { e.preventDefault(); showSignup(); });
      document.getElementById("toLogin").addEventListener("click", (e) => { e.preventDefault(); showLogin(); });
      document.getElementById("backToSignup").addEventListener("click", (e) => { e.preventDefault(); showSignup(); });

      // LOGIN
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearAlert("alertBox");
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;
        if (!email || !password) { showAlert("alertBox", t("auth.error.required"), "error"); return; }
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { showAlert("alertBox", t("auth.error.login"), "error"); return; }
        const { profile: p } = await getAuth();
        redirectByRole(p ? p.role : "student");
      });

      // SIGNUP — step 1: create account, send OTP
      let pendingSignup = null;
      signupForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearAlert("alertBox");
        const name = document.getElementById("suName").value.trim();
        const email = document.getElementById("suEmail").value.trim();
        const password = document.getElementById("suPassword").value;
        const password2 = document.getElementById("suPassword2").value;
        const role = document.getElementById("suRole").value;
        if (!name || !email || !password || !password2) { showAlert("alertBox", t("auth.error.required"), "error"); return; }
        if (password.length < 6) { showAlert("alertBox", t("auth.error.password_short"), "error"); return; }
        if (password !== password2) { showAlert("alertBox", t("auth.error.password_mismatch"), "error"); return; }
        pendingSignup = { name, email, password, role };
        const { data, error } = await sb.auth.signUp({
          email,
          password,
          options: { data: { full_name: name, role } },
        });
        if (error) { showAlert("alertBox", t("auth.error.signup") + " (" + error.message + ")", "error"); return; }
        if (data.session) {
          // Email confirmation disabled in the dashboard → already logged in
          redirectByRole(role);
        } else {
          // Confirmation email sent → show the OTP step
          showOtp(email);
        }
      });

      // SIGNUP — step 2: verify the 6-digit code
      otpForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearAlert("alertBox");
        const token = document.getElementById("otpCode").value.trim();
        if (!token) { showAlert("alertBox", t("auth.otp.code_required"), "error"); return; }
        if (!pendingSignup) return;
        const { error } = await sb.auth.verifyOtp({
          email: pendingSignup.email,
          token,
          type: "signup",
        });
        if (error) { showAlert("alertBox", t("auth.otp.invalid"), "error"); return; }
        window.location.href = pendingSignup.role === "teacher" ? "teacher.html" : "browse.html";
      });

      // RESEND the OTP code
      document.getElementById("resendCode").addEventListener("click", async (e) => {
        e.preventDefault();
        clearAlert("alertBox");
        if (!pendingSignup) return;
        const { error } = await sb.auth.resend({
          type: "signup",
          email: pendingSignup.email,
          options: { data: { full_name: pendingSignup.name, role: pendingSignup.role } },
        });
        if (error) { showAlert("alertBox", t("auth.otp.invalid") + " (" + error.message + ")", "error"); return; }
        showAlert("alertBox", t("auth.otp.resend_ok"), "success");
      });
    });
  </script>
</body>
</html>
